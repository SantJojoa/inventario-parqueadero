<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parqueadero Galeras — Inventario</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-in">
      <div class="titulo">
        <h1>Parqueadero Galeras</h1>
        <p>Inventario de vehículos: Excel de la empresa cruzado con Moviliza.</p>
      </div>
      <div class="sync" id="syncWidget"></div>
    </div>
  </header>

  <main>
    <section class="resumen" id="resumen" aria-label="Resumen"></section>

    <section class="panel">
      <div class="filtros">
        <div class="tabs" id="tabsCategoria" role="tablist" aria-label="Categoría"></div>
        <div class="filtros-fila">
          <label class="busqueda">
            <span class="sr-only">Buscar</span>
            <input type="search" id="buscar" placeholder="Buscar placa, ubicación u observación   ( / )" autocomplete="off" />
          </label>
          <label class="campo">
            <span>Tipo</span>
            <select id="filtroTipo"></select>
          </label>
          <label class="campo">
            <span>Salida</span>
            <select id="filtroSalida">
              <option value="">Todas</option>
              <option value="AUTORIZADO">Autorizada</option>
              <option value="PENDIENTE">Sin autorizar</option>
            </select>
          </label>
          <label class="campo">
            <span>Fuente</span>
            <select id="filtroFuente">
              <option value="">Todas</option>
              <option value="ambas">Excel y Moviliza</option>
              <option value="excel">Solo Excel</option>
              <option value="moviliza">Solo Moviliza</option>
            </select>
          </label>
          <button type="button" class="btn-texto" id="limpiar" hidden>Limpiar filtros</button>
        </div>
        <details class="periodo">
          <summary>Periodo de Moviliza: <strong id="periodoTxt"></strong></summary>
          <div class="periodo-campos">
            <label class="campo"><span>Desde</span><input type="date" id="inicio" /></label>
            <label class="campo"><span>Hasta</span><input type="date" id="fin" /></label>
            <p>Solo cuenta las placas que Moviliza registró en este periodo. Si cambia el rango, una placa puede pasar de Tránsito a Policía/Fiscalía.</p>
          </div>
        </details>
      </div>

      <div class="barra">
        <span class="conteo" id="conteo" aria-live="polite"></span>
        <div class="barra-acciones">
          <button type="button" class="btn" id="btnExcel">Descargar Excel</button>
          <button type="button" class="btn" id="btnWord">Descargar Word</button>
        </div>
      </div>

      <div id="tabla"></div>
    </section>
  </main>

<script src="app.js"></script>
</body>
</html>
