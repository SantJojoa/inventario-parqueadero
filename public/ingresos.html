<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresos — Moviliza</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span>Inventario Parqueadero</a>
    <div class="topbar-right">
      <nav>
        <a href="ingresos.html" class="active">Ingresos</a>
        <a href="salidas.html">Salidas</a>
        <a href="inventario.html">Inventario</a>
      </nav>
      <div class="sync-widget" id="syncWidget"></div>
    </div>
  </div>

  <main>
    <div class="page-header">
      <h1>Ingresos</h1>
      <p>Busca por fecha inicio, fecha fin y estado, o directo por placa.</p>
    </div>

    <form id="formConsulta" class="card card-pad">
      <div class="segmented">
        <button type="button" data-modo="fecha">Fecha y estado</button>
        <button type="button" data-modo="placa">Placa</button>
      </div>

      <div id="camposFecha" class="field-row">
        <div class="field">
          <label for="inicio">Fecha inicio</label>
          <input type="date" id="inicio" name="inicio" />
        </div>
        <div class="field">
          <label for="fin">Fecha fin</label>
          <input type="date" id="fin" name="fin" />
        </div>
        <div class="field">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="1">Ingreso</option>
            <option value="2">Salida</option>
            <option value="3">Autorización</option>
          </select>
        </div>
      </div>

      <div id="campoPlaca" class="field" style="display: none;">
        <label for="placa">Placa</label>
        <input type="text" id="placa" name="placa" placeholder="ABC123" />
      </div>

      <div class="form-footer">
        <span></span>
        <button type="submit" id="btnConsultar" class="btn btn-primary">Consultar</button>
      </div>
    </form>

    <div id="resultados" class="resultados"></div>
  </main>

<script src="app.js"></script>
<script>initModulo("ingresos");</script>
</body>
</html>
